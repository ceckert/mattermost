name: Thread post regression

on:
  pull_request:
    branches: [codex/mattermost-11.10.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-thread-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest_password
          POSTGRES_DB: mattermost_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mmuser -d mattermost_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      IS_CI: 'true'
      MM_SQLSETTINGS_DRIVERNAME: postgres
      TEST_DATABASE_POSTGRESQL_DSN: postgres://mmuser:mostest_password@localhost:5432/mattermost_test?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            server/public/go.sum
      - run: make setup-go-work
      - run: go test ./channels/store/sqlstore -run '^Test(Post|Thread)Store$' -count=1
